<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 个人 Web 在线编辑系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">管理后台</div>
    <div class="actions">
      <a href="/index.html">返回首页</a>
      <button class="secondary" id="btn-logout">登出</button>
    </div>
  </div>

  <div class="container">
    <div id="message"></div>

    <div class="tabs">
      <div class="tab active" data-tab="users">用户管理</div>
      <div class="tab" data-tab="types">文档类型</div>
      <div class="tab" data-tab="config">项目配置</div>
    </div>

    <div class="tab-content active" id="tab-users">
      <div class="card">
        <h3>创建用户</h3>
        <form id="create-user-form" style="display:flex;gap:8px;flex-wrap:wrap;">
          <input type="text" id="new-username" placeholder="账号" required>
          <input type="password" id="new-password" placeholder="密码" required>
          <input type="text" id="new-nickname" placeholder="昵称">
          <select id="new-role">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select>
          <button type="submit">创建</button>
        </form>
      </div>
      <div class="card" id="users-list"></div>
    </div>

    <div class="tab-content" id="tab-types">
      <div class="card">
        <h3>添加文档类型</h3>
        <form id="create-type-form" style="display:flex;gap:8px;">
          <input type="text" id="new-type-name" placeholder="类型名称" required>
          <input type="text" id="new-type-path" placeholder="存储路径" required>
          <button type="submit">添加</button>
        </form>
      </div>
      <div class="card" id="types-list"></div>
    </div>

    <div class="tab-content" id="tab-config">
      <div class="card">
        <h3>项目配置</h3>
        <form id="config-form">
          <div class="form-group">
            <label>OnlyOffice 服务器地址</label>
            <input type="text" id="onlyoffice-url" style="width:100%;">
          </div>
          <div class="form-actions">
            <button type="submit">保存配置</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="edit-user-modal" style="display:none;">
    <div class="modal">
      <h3>编辑用户</h3>
      <input type="hidden" id="edit-user-id">
      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="edit-user-nickname">
      </div>
      <div class="form-group">
        <label>角色</label>
        <select id="edit-user-role">
          <option value="user">普通用户</option>
          <option value="admin">管理员</option>
        </select>
      </div>
      <div class="form-group">
        <label>状态</label>
        <select id="edit-user-status">
          <option value="active">正常</option>
          <option value="inactive">停用</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="secondary" id="btn-cancel-edit-user">取消</button>
        <button type="submit" id="btn-save-user">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reset-password-modal" style="display:none;">
    <div class="modal">
      <h3>重置密码</h3>
      <input type="hidden" id="reset-user-id">
      <div class="form-group">
        <label>新密码</label>
        <input type="password" id="reset-password" required>
      </div>
      <div class="form-actions">
        <button class="secondary" id="btn-cancel-reset">取消</button>
        <button id="btn-confirm-reset">确认重置</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
