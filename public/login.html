<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 个人 Web 在线编辑系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <h2>个人 Web 在线编辑系统</h2>
      <div id="message"></div>

      <div class="tabs">
        <div class="tab active" data-tab="local">账号登录</div>
        <div class="tab" data-tab="demo">演示登录</div>
      </div>

      <div class="tab-content active" id="tab-local">
        <form id="login-form">
          <div class="form-group">
            <label>账号</label>
            <input type="text" id="username" placeholder="admin" required>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="admin" required>
          </div>
          <button type="submit" style="width: 100%;">登录</button>
        </form>
      </div>

      <div class="tab-content" id="tab-demo">
        <form id="demo-login-form">
          <div class="form-group">
            <label>昵称</label>
            <input type="text" id="demo-nickname" placeholder="请输入昵称" required>
          </div>
          <button type="submit" style="width: 100%;">演示登录</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const messageEl = document.getElementById('message');

    function showMessage(text, type = 'error') {
      messageEl.innerHTML = `\u003cdiv class="message ${type}">${text}\u003c/div\u003e`;
    }

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach((c) => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
      });
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        await api.auth.login(username, password);
        location.href = '/index.html';
      } catch (err) {
        showMessage(err.message);
      }
    });

    document.getElementById('demo-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nickname = document.getElementById('demo-nickname').value.trim();
      try {
        await api.auth.demoLogin(nickname);
        location.href = '/index.html';
      } catch (err) {
        showMessage(err.message);
      }
    });
  </script>
</body>
</html>
