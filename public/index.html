<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档管理 - 个人 Web 在线编辑系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-brand">文档管理</div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">文档类型</div>
        <a href="#" class="nav-item active" data-type="all">全部文档</a>
        <a href="#" class="nav-item nav-word" data-type="word">Word</a>
        <a href="#" class="nav-item nav-excel" data-type="excel">Excel</a>
        <a href="#" class="nav-item nav-ppt" data-type="ppt">PPT</a>
        <a href="#" class="nav-item nav-pdf" data-type="pdf">PDF</a>
      </nav>

      <div class="sidebar-footer">
        <a href="/admin.html" id="admin-link" class="nav-item" style="display:none;">管理后台</a>
        <div class="sidebar-user">
          <span class="user-avatar" id="user-avatar"></span>
          <span id="current-user" class="user-name"></span>
          <button class="secondary" id="btn-logout">登出</button>
        </div>
      </div>
    </aside>

    <!-- 右侧主区 -->
    <main class="main">
      <div id="message"></div>

      <div class="main-header">
        <h2 class="main-title" id="main-title">我的文档</h2>
        <div class="main-actions">
          <button type="button" id="btn-refresh" class="btn-refresh" title="刷新文档列表" aria-label="刷新">
            <span class="refresh-icon">&#8635;</span>
          </button>
          <div class="upload-form">
            <input type="file" id="upload-file" accept=".doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf" hidden>
            <button type="button" id="btn-upload">＋ 上传文档</button>
          </div>
        </div>
      </div>

      <div class="doc-wrap">
        <div id="doc-list"></div>
      </div>
    </main>
  </div>

  <!-- 全屏编辑器 -->
  <div class="card" id="editor-card" style="display:none;">
    <div class="toolbar">
      <h3 id="editor-title"></h3>
      <button class="secondary" id="btn-close-editor">关闭编辑器</button>
    </div>
    <div id="editor" class="editor-container"></div>
  </div>

  <!-- 权限管理弹窗 -->
  <div class="modal-overlay" id="permission-modal" style="display:none;">
    <div class="modal">
      <h3>权限管理</h3>
      <div id="permission-message"></div>
      <div class="form-group">
        <label>添加/修改权限</label>
        <div style="display:flex;gap:8px;">
          <select id="perm-user"></select>
          <select id="perm-level">
            <option value="view">查看</option>
            <option value="edit">编辑</option>
            <option value="admin">管理</option>
          </select>
          <button id="btn-add-perm">保存</button>
        </div>
      </div>
      <table class="permission-list">
        <thead>
          <tr>
            <th>用户</th>
            <th>权限</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="permission-table"></tbody>
      </table>
      <div class="form-actions">
        <button class="secondary" id="btn-close-perm">关闭</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
